{% extends "base.html" %}

{% block title %}Вход — RepairDesk{% endblock %}

{% block content %}
    <div style="max-width: 500px; margin: 0 auto;">
        <h2>Вход в систему</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn" style="width: 100%; padding: 15px; font-size: 18px;">Войти</button>
        </form>
        
        <div style="text-align: center; margin-top: 20px;">
            <a href="{% url 'forgot_password' %}" style="color: var(--text-muted); text-decoration: none; font-size: 14px;">Забыли пароль?</a>
            <br><br>
            <a href="{% url 'register' %}" style="color: var(--primary-color); text-decoration: none; font-weight: 600;">Нет аккаунта? Зарегистрироваться</a>
        </div>
    </div>
{% endblock %}
