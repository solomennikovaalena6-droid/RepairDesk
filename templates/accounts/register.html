{% extends "base.html" %}

{% block title %}Регистрация — RepairDesk{% endblock %}

{% block content %}
    <h2>Регистрация</h2>
    <form method="post" id="register-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Зарегистрироваться</button>
    </form>
    <p style="margin-top: 15px;"><a href="{% url 'login' %}">Уже есть аккаунт? Войти</a></p>
{% endblock %}
